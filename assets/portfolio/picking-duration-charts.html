<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Picking Duration — SKU Quantity vs SKU Lines</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f4;
    --card: #ffffff;
    --ink: #111111;
    --ink-soft: #6b6b6b;
    --line: #e4e4e2;
    --radius-card: 24px;
    --dot: #1c1c1c;
    --grid: #eeeeeb;
    --axis: #4a4a4a;
    --trend: #2f7cc6;
    --band: rgba(47, 124, 198, 0.14);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Space Mono', ui-monospace, monospace;
    background: #fff;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  .ch-section {
    background: var(--bg);
    border-radius: var(--radius-card);
    max-width: 960px;
    margin: 48px auto;
    padding: 40px 32px 44px;
  }

  .ch-caption {
    text-align: center;
    max-width: 560px;
    margin: 0 auto 32px;
  }
  .ch-caption .ch-tag {
    display: block;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }
  .ch-title-main {
    font-family: 'Inter', -apple-system, sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--ink);
    margin: 4px 0 12px;
    line-height: 1.25;
  }
  .ch-caption p { font-size: 15px; line-height: 1.55; }

  .ch-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    background: #fff;
    border-radius: 16px;
    padding: 24px 20px 12px;
  }

  @media (max-width: 720px) {
    .ch-grid { grid-template-columns: 1fr; }
    .ch-section { padding: 28px 16px 32px; margin: 24px 12px; }
  }

  .ch-card { display: flex; flex-direction: column; }
  .ch-title {
    text-align: center;
    font-family: 'Inter', -apple-system, sans-serif;
    font-size: 13px;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 8px;
  }
  .ch-svg-wrap {
    position: relative;
    width: 100%;
  }
  .ch-svg-wrap svg {
    display: block;
    width: 100%;
    height: auto;
    font-family: 'Inter', -apple-system, sans-serif;
  }

  /* Axis + label styling */
  .ch-axis-line { stroke: var(--axis); stroke-width: 1; }
  .ch-grid-line { stroke: var(--grid); stroke-width: 1; stroke-dasharray: 2 3; }
  .ch-tick { font-size: 8px; fill: var(--axis); }
  .ch-y-label, .ch-x-label {
    font-family: 'Inter', -apple-system, sans-serif;
    font-weight: 700;
    fill: var(--ink);
    font-size: 11px;
  }

  /* Dots animate in */
  .ch-dot {
    fill: var(--dot);
    fill-opacity: 0;
    transform-box: fill-box;
    transform-origin: center;
    transform: scale(0.4);
    transition: fill-opacity 0.3s ease, transform 0.3s ease;
  }
  .ch-dots.is-drawn .ch-dot {
    fill-opacity: 0.35;
    transform: scale(1);
  }

  /* Trend line + band on right chart */
  .ch-band { fill: var(--band); opacity: 0; transition: opacity 0.6s ease 0.4s; }
  .ch-trend {
    fill: none;
    stroke: var(--trend);
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 2000;
    stroke-dashoffset: 2000;
    transition: stroke-dashoffset 1.6s cubic-bezier(.5,.05,.15,1) 0.3s;
  }
  .is-drawn .ch-band { opacity: 1; }
  .is-drawn .ch-trend { stroke-dashoffset: 0; }

  @media (prefers-reduced-motion: reduce) {
    .ch-dot, .ch-band, .ch-trend { transition: none !important; }
  }

  .ch-legend {
    margin-top: 20px;
    text-align: center;
    font-size: 12px;
    color: var(--ink-soft);
    line-height: 1.6;
  }
  .ch-legend b { color: var(--ink); font-weight: 700; }
  .ch-legend .ch-swatch {
    display: inline-block;
    width: 14px;
    height: 2px;
    background: var(--trend);
    vertical-align: middle;
    margin: 0 4px;
  }
</style>
</head>

<script>
(function () {
  // Fallback: if external data didn't load, bail gracefully
  if (!window.CHART_DATA || !window.CHART_DATA.left) return;
  var D = window.CHART_DATA;

  function makeDot(x, y, delay) {
    var c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    c.setAttribute('cx', x);
    c.setAttribute('cy', y);
    c.setAttribute('r', 1.6);
    c.setAttribute('class', 'ch-dot');
    c.style.transitionDelay = delay + 'ms';
    return c;
  }

  function pathFrom(pts) {
    return 'M' + pts.map(function(p){return p[0]+','+p[1];}).join(' L');
  }
  function bandFrom(upper, lower) {
    return 'M' + upper.map(function(p){return p[0]+','+p[1];}).join(' L') +
           ' L' + lower.slice().reverse().map(function(p){return p[0]+','+p[1];}).join(' L') + ' Z';
  }

  // Populate dot groups
  document.querySelectorAll('.ch-dots').forEach(function (g) {
    var key = g.getAttribute('data-target');
    var pts = D[key];
    // stagger delay across ~900ms
    var total = pts.length;
    var frag = document.createDocumentFragment();
    for (var i = 0; i < total; i++) {
      var p = pts[i];
      // random within the array to avoid a directional wipe
      var delay = Math.floor(Math.random() * 900);
      frag.appendChild(makeDot(p[0], p[1], delay));
    }
    g.appendChild(frag);
  });

  // Set trend + band paths (right chart)
  var band = document.querySelector('.ch-band');
  var trend = document.querySelector('.ch-trend');
  if (band && D.tupper && D.tlower) band.setAttribute('d', bandFrom(D.tupper, D.tlower));
  if (trend && D.tline) trend.setAttribute('d', pathFrom(D.tline));

  // Trigger animation when the section scrolls into view (or immediately if already visible)
  var section = document.querySelector('.ch-section');
  function play() {
    document.querySelectorAll('.ch-dots').forEach(function (g) {
      g.classList.add('is-drawn');
    });
    var wrap = document.querySelector('.ch-card:nth-child(2) .ch-svg-wrap svg');
    if (wrap) wrap.classList.add('is-drawn');
  }

  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) { play(); io.disconnect(); }
      });
    }, { threshold: 0.2 });
    io.observe(section);
  } else {
    play();
  }
})();
</script>
