          <section>
            <h1>Risti Ulfha — AI-Native Product Builder, Design Lead &amp; UX Research Strategist</h1>
            <p>10+ years building products across APAC, APJ, European Economic Area, Jakarta, Australia, and New Zealand. Specialization: product design, user research for discovery, design systems, design strategy, and AI-embedded product workflows. Available for Design Manager, Design Lead, Design Strategist, and AI-Native Product Builder roles at multinational companies.</p>
            <p>Products reached 45M MAU across career. Deep expertise in field research and ethnography, omnichannel product strategy, cross-functional design leadership, and AI workflow integration. Experience across Southeast Asia, Japan, UK, Germany, and Indonesia. Industries: agriculture tech, travel, supply chain, consumer electronics, edutech, advertising.</p>
            <p>Comfortable operating in high-ambiguity environments. Combines 10+ years of product design instinct with an AI-curious mindset — actively building with AI tools including V0, Claude, and vibe coding. Proven track record managing distributed teams remotely across SEA, UK, and Europe.</p>
          </section>
          <article>
            <h1>Shaping Product Vision Through Omnichannel O2O Design Strategy — eFishery, Indonesia</h1>
            <p>How do you reduce the cost of field officers when maintaining human services for every farmer is unsustainable?</p>
            <p>Outcomes: +35% self-transaction adoption from 19% baseline among rural low-tech users. +16.5% conversion uplift on quick order feature, p-value 0.0026. 5,000 MAU six months post-launch. IDR 9.77B GMV in month one of reorder feature.</p>
            <p>Fish farmers in rural Indonesia order supplies by calling field officers. App adoption stagnant at 19% despite existing product. 90% of farmers already on WhatsApp daily. The core insight: one solution does not fit all users. Built a second path — WhatsApp for farmers who prefer existing habits, app for those who don't. Design Manager with a team of 4. Owned the strategy direction, field research, cross-functional design workshop facilitation, and design calls across both channels.</p>
            <p>Skills demonstrated: product discovery, ethnographic field research, omnichannel design strategy, cross-functional alignment, design management in an AI-adjacent agritech environment, Southeast Asia market.</p>
          </article>
          <article>
            <h1>Improving Price Perception in Hotel Booking Discovery — Traveloka, APAC</h1>
            <p>How do you optimize pricing perception for 35 million users when the operation behind it is still managing labels manually?</p>
            <p>Outcomes: Pricing label hierarchy integrated directly into Traveloka's pricing engine. Serves hotel-facing, internal, affiliate, and marketing campaigns in one unified platform. Less manual work per campaign at scale.</p>
            <p>Traveloka is one of Southeast Asia's largest travel platforms with 35M MAU. Pricing was the primary decision factor but the system could not scale. Applied Gestalt principles to reorganize hotel listing information hierarchy. Built a ranking system for label conflicts. Solution escalated to VP of Product, Head of Pricing, and CEO. Interaction Designer. Revenue-critical change at regional scale.</p>
            <p>Skills demonstrated: interaction design, pricing UX, systems thinking, executive stakeholder communication, large-scale consumer product, APAC market.</p>
          </article>
          <article>
            <h1>Improving Warehouse Logistics Efficiency — Warung Pintar, Indonesia</h1>
            <p>How do you optimize warehouse picking processes that accommodate varying order volumes and variant SKUs?</p>
            <p>Outcomes: 6.7x faster probable picking time. Cluster picking adopted in high-volume warehouses post-rollout. Picker app designed for diverse literacy levels using visual-first UI.</p>
            <p>Warung Pintar serves micro retail stores with 4x more SKU variety than typical e-commerce. Discovery through timed field observation: picking duration correlated with SKU line variety, not quantity. Ran service prototype with VP, data scientists, PMs, and engineers. UX Researcher. Data-driven service design at supply chain scale.</p>
            <p>Skills demonstrated: service design, UX research, data analysis, field observation, service prototyping, supply chain product design, inclusive design for low-literacy users.</p>
          </article>
          <article>
            <h1>Forecasting Visual Product Trends — Casio Design Japan, Chiba University, Institut Teknologi Bandung</h1>
            <p>On the next 4 years, what will happen to visual imagery products with the rise of digital photography?</p>
            <p>Outcomes: Forecast validated within 3 years. Instagram Boomerang launched, echoing the same morphing-photo instinct we prototyped. Analog camera resurgence confirmed the predicted retro nuance trend.</p>
            <p>Joint research across Japan and Indonesia. 150 participants, ethnographic study, trend framework across past-present-future signals. Cross-cultural consumer research spanning APJ. Design Researcher. Synthesized end-to-end across both countries.</p>
            <p>Skills demonstrated: trend forecasting, design speculation, ethnographic research, cross-cultural research, APJ consumer insight, Japan market, Indonesia market.</p>
          </article>
          <article>
            <h1>Fractional UX Lead — Context Labs, Indonesia</h1>
            <p>Embedded AI design workflows while establishing design expectations and hiring roadmap for the first design team. Acting as bridge between design and executive leadership across product discovery, design strategy, and design execution. Clients across public institutions, advertising, edutech, and travel. Regions: Indonesia, Japan.</p>
            <p>Skills demonstrated: fractional design leadership, AI workflow integration, design ops, team building, design strategy for early-stage products.</p>
          </article>
          <article>
            <h1>Leadership and Team Management — Building High-Performing Design Teams at Scale</h1>
            <p>Design Manager with 10+ years leading distributed design teams across APAC, Jakarta, UK, and Germany. Available for Design Manager, Design Lead, and Head of Design roles at AI-native product companies and multinationals in APJ, APAC, European Economic Area, Australia, and New Zealand.</p>
            <p>Framework: Purpose, People, and Process. 85% of collaborators report a productive partnership that consistently drives objectives. NPS from Product Managers: 8/10 across 41 respondents. NPS from Engineering: 9/10. Pulse check scores: highest in transparency, direction, and empowerment (3.8/5) among all design teams.</p>
            <p>Directed hyperlocal design system adopted across 10 platforms, supporting company hypergrowth. Led AI-embedded design workflow using V0 — proved to speed discovery and delivery, create shared language between design and engineering, and reduce rework. Remote leadership experience across 7 years in Indonesia, UK, and Germany.</p>
            <p>Approach: strength-based goal setting, psychological safety as foundation, data-design alliance, stakeholder relationship management. Cross-functional recognition from CPO, Head of Product, and Sr. Data Manager.</p>
            <p>Skills demonstrated: design management, team leadership, AI workflow integration, remote leadership, design ops, design systems direction, cross-functional alignment, APJ and European Economic Area experience.</p>
          </article>

  <script>
    const id = window.location.hash.replace('#', '');
    const project = projects.find(p => p.id === id);
    const el = document.getElementById('project-content');

    if (!project) {
      el.innerHTML = '<p class="stub-notice">Project not found.</p>';
    } else {
      document.title = `${project.title} — Risti`;

      if (project.type === 'article') {
        const paper = document.querySelector('.paper');
        if (paper) paper.classList.add('paper--article');
        document.body.style.background = '#ffffff';
        document.documentElement.style.background = '#ffffff';
      }

      const skeleton = el.querySelector('.project-skeleton');
      const content = document.createElement('div');
      content.innerHTML = renderProject(project);
      content.style.cssText = 'opacity:0;transition:opacity 0.4s ease;';
      el.appendChild(content);

      function revealContent() {
        if (skeleton) skeleton.classList.add('is-hidden');
        requestAnimationFrame(() => {
          content.style.opacity = '1';
          // Trigger tag animation after content fully fades in
          setTimeout(() => {
            const tags = content.querySelector('.js-hero-tags');
            if (tags) tags.classList.add('is-ready');
          }, 450);
          // Set --color-end: at least full viewport, extends if hook goes below fold
          setTimeout(() => {
            const layout = document.querySelector('.project-layout');
            const main = document.querySelector('.project-main');
            const hookEl = content.querySelector('#section-hook');
            if (layout && main) {
              const mainTop = main.getBoundingClientRect().top + window.scrollY;
              const hookBottom = hookEl
                ? hookEl.getBoundingClientRect().bottom + window.scrollY
                : mainTop + 500;
              const viewportEnd = window.innerHeight - mainTop;
              const colorEnd = Math.max(hookBottom - mainTop + 20, viewportEnd);
              layout.style.setProperty('--color-end', colorEnd + 'px');
              // Position sidenav links so their BOTTOM aligns with the BOTTOM of the hook
              if (window.innerWidth >= 900) {
                const sidenavLinks = document.querySelector('.project-sidenav-links');
                const sidenavMeta = document.querySelector('.project-sidenav-meta');
                if (sidenavLinks) {
                  const sidenavTop = main.getBoundingClientRect().top + window.scrollY;
                  const hookBottom = hookEl
                    ? hookEl.getBoundingClientRect().bottom + window.scrollY
                    : sidenavTop + 700;
                  const linksHeight = sidenavLinks.offsetHeight;
                  const metaHeight = sidenavMeta ? sidenavMeta.offsetHeight + 28 : 0;
                  // back arrow: ~1.4rem height + 40px margin-bottom ≈ 62px
                  const backArrowArea = 62;
                  const offset = (hookBottom - sidenavTop) - backArrowArea - metaHeight - linksHeight - 80;
                  sidenavLinks.style.marginTop = Math.max(offset, 10) + 'px';
                }
              }
            }
          }, 80);
        });
        initTimeline();
        initRisoImages();
        initSectionPhotos();
        initSidenav(project);
        initColorTransition(project);
        initReadGate();
        initArticleExpand();
        initArticleStack();
        initSectionTracking();
      }

      const heroImg = content.querySelector('.project-hero-mainimg');
      if (heroImg) {
        const fallback = setTimeout(revealContent, 5000);
        const onReady = () => { clearTimeout(fallback); revealContent(); };
        const loadEvent = heroImg.tagName === 'VIDEO' ? 'canplay' : 'load';
        heroImg.addEventListener(loadEvent, onReady, { once: true });
        heroImg.addEventListener('error', onReady, { once: true });
        if (heroImg.tagName === 'VIDEO' && heroImg.readyState >= 3) onReady();
      } else {
        revealContent();
      }
    }

    function renderArticleSections(sections) {
      return (sections || []).map(s => {
        if (s.type === 'intro') {
          return `<p class="article-intro">${s.text}</p>`;
        } else if (s.type === 'pull-quote') {
          return `<blockquote class="article-pull-quote">
            <p>${s.text}</p>
            <cite>${s.author}</cite>
          </blockquote>`;
        } else if (s.type === 'image') {
          return `<figure class="article-figure">
            <img src="${s.url}" alt="" loading="lazy" />
            ${s.caption ? `<figcaption>${s.caption}</figcaption>` : ''}
          </figure>`;
        } else if (s.type === 'section') {
          const quotes = (s.quotes || []).map(q => `<blockquote class="article-quote">${q}</blockquote>`).join('');
          return `<div class="article-section">
            <p class="article-section-label"><span class="article-section-number">${s.number}</span> ${s.title}</p>
            <p class="article-section-subtitle">${s.subtitle}</p>
            <p>${s.body}</p>
            ${quotes}
          </div>`;
        } else if (s.type === 'impact') {
          const stats = (s.stats || []).map(st => `<li>${st}</li>`).join('');
          const quotes = (s.quotes || []).map(q => `<blockquote class="article-quote">${q}</blockquote>`).join('');
          return `<div class="article-section article-impact">
            <p class="article-section-label">Impact</p>
            <p>${s.body}</p>
            ${stats ? `<ul class="article-stats">${stats}</ul>` : ''}
            ${s.note ? `<p class="article-note">${s.note}</p>` : ''}
            ${quotes}
          </div>`;
        } else if (s.type === 'themes') {
          const items = (s.items || []).map(t => `
            <div class="article-theme-item">
              <p class="article-theme-label">${t.label}</p>
              <p class="article-theme-desc">${t.description}</p>
            </div>`).join('');
          return `<div class="article-themes">${items}</div>`;
        } else if (s.type === 'approach') {
          const steps = (s.steps || []).map(st => `
            <div class="article-step">
              <span class="article-step-number">${st.number}</span>
              <div>
                <p class="article-step-title">${st.title}</p>
                <p class="article-step-desc">${st.description}</p>
              </div>
            </div>`).join('');
          return `<div class="article-section">
            <p class="article-section-label">${s.label}</p>
            <div class="article-steps">${steps}</div>
          </div>`;
        } else if (s.type === 'testimonial') {
          return `<blockquote class="article-quote article-testimonial">
            <p>${s.text}</p>
            <cite>${s.author}</cite>
          </blockquote>`;
        }
        return '';
      }).join('');
    }

    function renderArticleProject(p) {
      const articles = p.articles || [];

      // Retro palette — warm, muted, pulled from the "scattered cards" reference
      const CARD_COLORS   = ['#C2CCBE', '#EDE4A0', '#EEBCAA', '#000000', '#F5F0E8'];
      const CARD_INKS     = ['#000000', '#000000', '#000000', '#ffffff', '#000000'];
      const CARD_DIVIDERS = ['rgba(0,0,0,0.09)', 'rgba(0,0,0,0.09)', 'rgba(0,0,0,0.09)', 'rgba(255,255,255,0.15)', 'rgba(0,0,0,0.09)'];
      const STACK_ROTS    = [-7, 5, -4, 8, -6, 3];
      const STACK_TX      = [10, -14, 18, -8, 12, -6];
      const SPREAD_ROTS   = [-2.2, 0.8, -1.5, 2, -1, 1.5];

      const cardsHtml = articles.map((a, i) => {
        const intro = (a.sections || []).find(s => s.type === 'intro');
        const restSections = (a.sections || []).filter(s => s.type !== 'intro');
        const cardId = `article-expand-${i}`;
        const color   = CARD_COLORS[i % CARD_COLORS.length];
        const ink     = CARD_INKS[i % CARD_INKS.length];
        const divider = CARD_DIVIDERS[i % CARD_DIVIDERS.length];
        const rot     = STACK_ROTS[i % STACK_ROTS.length];
        const tx      = STACK_TX[i % STACK_TX.length];
        const zIndex  = articles.length - i;
        return `
          <div class="article-card" id="article-card-${i}"
               data-spread-rot="${SPREAD_ROTS[i % SPREAD_ROTS.length]}"
               data-stack-rot="${rot}"
               data-stack-tx="${tx}"
               data-orig-z="${zIndex}"
               style="--card-bg:${color};--card-ink:${ink};--card-divider:${divider};z-index:${zIndex};opacity:0;">
            <p class="article-card-number">0${i + 1}</p>
            <h2 class="article-card-title">${a.title}</h2>
            ${intro ? `<p class="article-intro">${intro.text}</p>` : ''}
            <div class="article-card-body" id="${cardId}">
              ${renderArticleSections(restSections)}
            </div>
            <button class="article-read-more" data-target="${cardId}" data-index="${i}" aria-expanded="false">Read more</button>
          </div>
        `;
      }).join('');

      return `
        <div class="article-page">
          <div class="article-header">
            <h1 class="article-title">${p.title}</h1>
            <p class="article-company">${p.company}</p>
          </div>
          <div class="article-stack">
            ${cardsHtml}
          </div>
        </div>
      `;
    }

    function initArticleStack() {
      const stack = document.querySelector('.article-stack');
      if (!stack) return;
      const cards = [...stack.querySelectorAll('.article-card')];
      if (!cards.length) return;

      const PEEK = 68;
      const FALL_DURATION = 600; // ms per card
      const FALL_STAGGER  = 130; // ms between cards
      const LAND_PAUSE    = 320; // ms after last card lands before spread
      const FALL_LIMIT    = 4;   // only first N cards animate falling

      // Measure card height for pile overlap
      const cardHeight = cards[0].offsetHeight;

      // Set pile margins (collapsed)
      cards.forEach((card, i) => {
        if (i === 0) return;
        card.style.marginTop = `-${cardHeight - PEEK}px`;
      });

      // Cards beyond FALL_LIMIT skip the fall — start hidden, reveal after spread
      cards.forEach((card, i) => {
        const rot = parseFloat(card.dataset.stackRot || 0);
        const tx  = parseFloat(card.dataset.stackTx  || 0);
        card.style.transition = 'none';
        if (i < FALL_LIMIT) {
          card.style.transform = `rotate(${rot}deg) translateX(${tx}px) translateY(-110vh)`;
          card.style.opacity   = '1';
        } else {
          card.style.transform = `rotate(${rot}deg) translateX(${tx}px)`;
          card.style.opacity   = '0';
        }
      });

      // Staggered fall: only first FALL_LIMIT cards drop in
      requestAnimationFrame(() => requestAnimationFrame(() => {
        cards.forEach((card, i) => {
          if (i >= FALL_LIMIT) return;
          const rot = parseFloat(card.dataset.stackRot || 0);
          const tx  = parseFloat(card.dataset.stackTx  || 0);
          setTimeout(() => {
            card.style.transition = `transform ${FALL_DURATION}ms cubic-bezier(0.22, 1, 0.36, 1)`;
            card.style.transform  = `rotate(${rot}deg) translateX(${tx}px)`;
          }, i * FALL_STAGGER);
        });

        // After all cards have landed, spread into readable list + reveal remaining
        const allLanded = (Math.min(cards.length, FALL_LIMIT) - 1) * FALL_STAGGER + FALL_DURATION + LAND_PAUSE;
        setTimeout(() => {
          cards.forEach((card, i) => {
            const spreadRot = parseFloat(card.dataset.spreadRot || 0);
            card.style.transition = `transform 0.7s cubic-bezier(0.22,1,0.36,1) ${i * 0.08}s, margin-top 0.7s cubic-bezier(0.22,1,0.36,1) ${i * 0.08}s, opacity 0.4s ease ${i * 0.08}s`;
            card.style.transform  = `rotate(${spreadRot}deg)`;
            card.style.opacity    = '1';
            if (i > 0) card.style.marginTop = '2.5rem';
          });
        }, allLanded);
      }));
    }

    function initArticleExpand() {
      const overlay = document.createElement('div');
      overlay.id = 'article-dim-overlay';
      overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.15);opacity:0;pointer-events:none;transition:opacity 0.45s ease;z-index:200;';
      document.body.appendChild(overlay);

      function showOverlay() { overlay.style.opacity = '1'; overlay.style.pointerEvents = 'auto'; }
      function hideOverlay() { overlay.style.opacity = '0'; overlay.style.pointerEvents = 'none'; }

      document.querySelectorAll('.article-read-more').forEach(btn => {
        btn.addEventListener('click', () => {
          const body = document.getElementById(btn.dataset.target);
          const card = body.closest('.article-card');
          const expanded = body.classList.contains('is-open');
          body.classList.toggle('is-open', !expanded);

          if (!expanded) {
            card.dataset.savedTransform = card.style.transform;
            card.style.transform = 'rotate(0deg)';
            card.style.position = 'relative';
            card.style.zIndex = '300';
            showOverlay();
          } else {
            card.style.transform = card.dataset.savedTransform || '';
            card.style.zIndex = card.dataset.origZ || '';
            hideOverlay();
          }
          btn.textContent = expanded ? 'Read more' : 'Read less';

          if (!expanded) {
            card.dataset.savedBg      = card.style.getPropertyValue('--card-bg');
            card.dataset.savedInk     = card.style.getPropertyValue('--card-ink');
            card.dataset.savedDivider = card.style.getPropertyValue('--card-divider');
            card.style.setProperty('--card-bg', '#ffffff');
            card.style.setProperty('--card-ink', '#000000');
            card.style.setProperty('--card-divider', 'rgba(0,0,0,0.09)');
          } else {
            card.style.setProperty('--card-bg',      card.dataset.savedBg      || '');
            card.style.setProperty('--card-ink',     card.dataset.savedInk     || '');
            card.style.setProperty('--card-divider', card.dataset.savedDivider || '');
          }
        });
      });

      overlay.addEventListener('click', () => {
        const openBody = document.querySelector('.article-card-body.is-open');
        if (!openBody) return;
        openBody.closest('.article-card').querySelector('.article-read-more').click();
      });
    }

    function renderListProject(p) {
      
      return `
        <div class="project-hero">
          <div class="project-hero-text">
            <h1 class="project-hero-title">${p.title}</h1>
            <div class="project-hero-keywords"><span>${p.company}</span></div>
          </div>
        </div>
        <div class="project-body">
          <div class="content-section">
            <p>${p.description}</p>
          </div>
          <div class="content-section">
            <p class="section-heading">Clients</p>
            <div class="client-list">
              ${p.clients.map((c, i) => `
                <div class="client-item" id="client-${i}">
                  <div class="client-header">
                    <span class="client-name">${c.client}${c.url ? `<a class="client-link" href="${c.url}" target="_blank" rel="noopener" aria-label="Visit ${c.client}"><svg width="10" height="10" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M5 2H2a1 1 0 0 0-1 1v7a1 1 0 0 0 1 1h7a1 1 0 0 0 1-1V7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M8 1h3v3M11 1L6.5 5.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></a>` : ''}</span>
                    <span class="client-industry">${c.industry}</span>
                  </div>
                  <p class="client-description">${c.description}</p>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function renderProject(p) {
      if (p.type === 'list') return renderListProject(p);
      if (p.type === 'article') return renderArticleProject(p);
      // ── Hero block ────────────────────────────────────────────
      const heroBg = p.heroImage || (p.projectPlanning && p.projectPlanning.find(s => s.image)?.image) || '';

      const heroColor = '#ffffff';

      // 4 hardcoded scatter slots — positions work at any width ≤ 560px
      // --fx/fy/fr = final scattered; --sx/sy/sr = stacked (center pile)
      const SCATTER_SLOTS = [
        { hw:'210px', fx:'2%',   fy:'20px',  fr:'-9deg',  fz:1,  sx:'30%', sy:'55px', sr:'-5deg',  fd:'0ms'   },
        { hw:'190px', fx:'22%',  fy:'-10px', fr:'5deg',   fz:3,  sx:'30%', sy:'55px', sr:'3deg',   fd:'40ms'  },
        { hw:'220px', fx:'44%',  fy:'30px',  fr:'-6deg',  fz:2,  sx:'30%', sy:'55px', sr:'-2deg',  fd:'20ms'  },
        { hw:'180px', fx:'68%',  fy:'-5px',  fr:'11deg',  fz:4,  sx:'30%', sy:'55px', sr:'8deg',   fd:'60ms'  },
      ];
      const heroImgs = (p.sectionImages || []).slice(0, 4);
      const heroScatterHtml = heroImgs.length ? `
        <div class="hero-scatter js-hero-scatter is-stacked">
          ${heroImgs.map((img, i) => {
            const s = SCATTER_SLOTS[i];
            return `<img class="hero-img" src="${img.url}" alt="" loading="lazy" style="--hw:${s.hw};--fx:${s.fx};--fy:${s.fy};--fr:${s.fr};--fz:${s.fz};--sx:${s.sx};--sy:${s.sy};--sr:${s.sr};--fd:${s.fd}" />`;
          }).join('')}
        </div>` : '';

      // Tagged hero — full image with floating tag chips
      const TAG_POSITIONS = [
        { top:    '10%', left:  '8%'  },
        { top:    '8%',  right: '10%' },
        { top:    '42%', left:  '6%'  },
        { bottom: '12%', right: '8%'  },
        { bottom: '10%', left:  '12%' },
        { top:    '24%', right: '6%'  },
        { bottom: '32%', left:  '10%' },
      ];
      const taggedHeroHtml = (p.heroImage && p.tags && p.tags.length) ? `
        <div class="project-hero project-hero--tagged">
          <div class="project-hero-text">
            <h1 class="project-hero-title">${p.title}</h1>
            ${p.company ? `<p class="project-hero-company">${p.company}</p>` : ''}
          </div>
          <div class="project-hero-imgwrap">
            ${p.heroImage.endsWith('.mp4')
              ? `<video class="project-hero-mainimg" src="${p.heroImage}" autoplay loop muted playsinline></video>`
              : `<img class="project-hero-mainimg" src="${p.heroImage}" alt="${p.title}" onload="this.classList.add('is-loaded')" />`
            }
            <div class="hero-tags js-hero-tags">
              ${p.tags.map((t, i) => {
                const pos = TAG_POSITIONS[i % TAG_POSITIONS.length];
                const style = Object.entries(pos).map(([k,v]) => `${k}:${v}`).join(';');
                return `<span class="hero-tag" style="${style};--ti:${i}">${t}</span>`;
              }).join('')}
            </div>
          </div>
        </div>` : '';

      const heroHtml = taggedHeroHtml || `
        <div class="project-hero${p.sectionImages && p.sectionImages.length ? ' project-hero--scatter' : ''}">
          <div class="project-hero-text">
            <h1 class="project-hero-title">${p.title}</h1>
            ${(p.company || p.tags?.length) ? `<div class="project-hero-keywords"><span>${[p.company, p.industry].filter(Boolean).join(' · ')}</span>${p.tags?.length ? `<span>${p.tags.join(', ')}</span>` : ''}</div>` : ''}
          </div>
          ${heroScatterHtml || `<div class="project-hero-image" style="${heroBg ? '' : `background:${heroColor};`}">${heroBg ? `<img src="${heroBg}" alt="${p.title}" />` : ''}</div>`}
        </div>`;

      // ── Body ──────────────────────────────────────────────────
      const body = `<div class="project-body">`;
      const bodyClose = `</div>`;

      const hookHtml = p.hook ? `
        <div class="content-section" id="section-hook" data-section="hook">
          <blockquote class="hook-text">${p.hook}</blockquote>
        </div>` : '';

      const impactHtml = p.impact && p.impact.length ? `
        <div class="content-section" id="section-outcome" data-section="outcome">
          <p class="section-heading">Outcome</p>
          <ol>${p.impact.map(i => `<li>${i}</li>`).join('')}</ol>
        </div>` : '';

      // Helper: render inline photos for a given section
      function sectionPhotos(section) {
        if (!p.sectionImages || !p.sectionImages.length) return '';
        const imgs = p.sectionImages.filter(img => img.section === section);
        if (!imgs.length) return '';
        return `<div class="section-photos js-section-photos" data-section="${section}">
          ${imgs.map((img, i) => `
            <figure class="section-photo">
              <img src="${img.url}" alt="" loading="lazy" referrerpolicy="no-referrer" />
            </figure>`).join('')}
        </div>`;
      }

      const situationHtml = (p.situation || p.insight) ? `
        <div class="content-section" id="section-situation" data-section="situation">
          <p class="section-heading">Situation</p>
          ${p.situation ? `<p>${p.situation}</p>` : ''}
          ${p.insight ? `<p>${p.insight}</p>` : ''}
          ${sectionPhotos('situation')}
        </div>` : '';

      // Direction + strategy card side by side
      const directionParas = p.direction ? p.direction.split('\n\n') : [];
      const directionFirstPara = directionParas[0] || '';
      const directionRestParas = directionParas.slice(1).join('\n\n');

      const cardHtml = (p.projectPlanning && p.projectPlanning.length) || p.strategyCardImage ? `
        <div class="content-section" id="section-direction" data-section="approach">
          <p class="section-heading">Approach & Contribution</p>
          ${directionFirstPara ? `<p>${directionFirstPara}</p>` : ''}
          <div class="direction-cols">
            <div class="strategy-card">
              <p class="strategy-card-title">${p.strategyTitle || (p.projectPlanning && p.projectPlanning[0].label) || ''}</p>
              ${p.strategyCardImage ? `<img src="${p.strategyCardImage}" alt="" class="strategy-card-img" loading="lazy" />` : ''}
            </div>
            <div class="direction-text">${directionRestParas.split('\n\n').map(para => `<p>${para}</p>`).join('')}</div>
          </div>
          ${p.contribution ? `<p>${p.contribution}</p>` : ''}
          ${sectionPhotos('direction')}
        </div>` : (p.direction ? `
        <div class="content-section" id="section-direction" data-section="approach">
          <p class="section-heading">Approach & Contribution</p>
          ${directionParas.map(para => `<p>${para}</p>`).join('')}
          ${p.contribution ? `<p>${p.contribution}</p>` : ''}
          ${sectionPhotos('direction')}
        </div>` : '');

      // What shifted + screenshot side by side
      const whatShiftedHtml = p.whatShifted ? `
        <div class="content-section" id="section-shifted" data-section="reflection">
          <p class="section-heading">My Reflection</p>
          ${p.screenshots && p.screenshots.length ? `
          <div class="shifted-cols">
            <div class="shifted-text">${p.whatShifted.split('\n\n').map(para => `<p>${para}</p>`).join('')}</div>
            <div class="shifted-img"><img src="${p.screenshots[0]}" alt="" loading="lazy" /></div>
          </div>` : p.whatShifted.split('\n\n').map(para => `<p>${para}</p>`).join('')}
          ${sectionPhotos('whatShifted')}
        </div>` : '';

      return `
        ${heroHtml}
        ${hookHtml}
        <div class="project-body" style="padding-top:0;padding-bottom:0;">${impactHtml}</div>
        <div class="read-gate is-closed" id="read-gate">
          ${body}
            ${situationHtml}
            ${cardHtml}
            ${whatShiftedHtml}
          ${bodyClose}
        </div>
        <div class="project-body" style="padding-top:0;padding-bottom:2rem;">
          <button class="read-more-btn" id="read-more-btn">Read case study</button>
        </div>
      `;
    }

    function initTimeline() {
      const items = document.querySelectorAll('.js-timeline-item');
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('is-visible');
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.15 });
      items.forEach(item => observer.observe(item));
    }

    function initSectionPhotos() {
      const photos = document.querySelectorAll('.section-photo');
      if (!photos.length) return;
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const siblings = [...entry.target.closest('.section-photos').querySelectorAll('.section-photo')];
            const idx = siblings.indexOf(entry.target);
            setTimeout(() => entry.target.classList.add('is-visible'), idx * 60);
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.1 });
      photos.forEach(p => observer.observe(p));
    }

    function initSidenav(p) {
      const meta = document.querySelector('.js-sidenav-meta');
      const links = document.querySelector('.js-sidenav-links');
      if (!meta || !links) return;

      meta.innerHTML = '';

      let sections = [];

      if (p.type === 'article' && p.articles) {
        // Leadership-style: one nav entry per card, using card id and title
        sections = p.articles.map(a => ({ id: `article-card-${p.articles.indexOf(a)}`, label: a.title }));
      } else if (p.type === 'list' && p.clients) {
        // Context Labs-style: show industry focus label, no nav links
        const industries = p.clients.map(c => c.industry).join(', ');
        links.innerHTML = `<span class="sidenav-industry-label"><strong>Client industry focus</strong><br>${industries}</span>`;
        return;
      } else {
        // Default case study sections
        sections = [
          { id: 'section-outcome',   label: 'Outcome' },
          { id: 'section-situation', label: 'Situation' },
          { id: 'section-direction', label: 'Approach & Contribution' },
          { id: 'section-shifted',   label: 'My Reflection' },
        ].filter(s => document.getElementById(s.id));
      }

      links.innerHTML = sections.map(s =>
        `<a class="sidenav-link" href="#${s.id}" data-section="${s.id}">
          ${s.label}${s.sublabel ? `<span class="sidenav-link-sub">${s.sublabel}</span>` : ''}
        </a>`
      ).join('');

      // Scrollspy
      const anchors = sections.map(s => document.getElementById(s.id)).filter(Boolean);
      const navLinks = links.querySelectorAll('.sidenav-link');

      function updateActive() {
        let current = anchors[0];
        for (const el of anchors) {
          if (el && el.getBoundingClientRect().top <= window.innerHeight * 0.35) current = el;
        }
        if (current) navLinks.forEach(a => a.classList.toggle('is-active', a.dataset.section === current.id));
      }

      window.addEventListener('scroll', updateActive, { passive: true });
      updateActive();

      // Smooth scroll on click
      links.addEventListener('click', e => {
        const a = e.target.closest('.sidenav-link');
        if (!a) return;
        e.preventDefault();
        document.getElementById(a.dataset.section)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    }

    function initColorTransition() {
      // Color transition removed — all pages use white background
    }

    function initReadGate() {
      const gate = document.getElementById('read-gate');
      const btn  = document.getElementById('read-more-btn');
      if (!gate || !btn) return;

      btn.addEventListener('click', () => {
        gate.classList.remove('is-closed');
        btn.classList.add('is-hidden');
        gate.scrollIntoView({ behavior: 'smooth', block: 'start' });

        const projectId = window.location.hash.replace('#', '');
        if (typeof gtag !== 'undefined') {
          gtag('event', 'read_case_study', { project_id: projectId });
        }
      });
    }

    function initSectionTracking() {
      const projectId = window.location.hash.replace('#', '');
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(e => {
          if (!e.isIntersecting) return;
          const section = e.target.dataset.section;
          if (section && typeof gtag !== 'undefined') {
            gtag('event', 'section_viewed', { section, project_id: projectId });
          }
          observer.unobserve(e.target);
        });
      }, { threshold: 0.5 });

      document.querySelectorAll('[data-section]').forEach(el => observer.observe(el));
    }

    function initRisoImages() {
      document.querySelectorAll('.js-riso-container').forEach(wrapper => {
        const img = wrapper.querySelector('.js-riso-img');
        if (!img) return;
        const onLoad = () => wrapper.classList.add('loaded');
        if (img.complete && img.naturalWidth > 0) {
          onLoad();
        } else {
          img.addEventListener('load', onLoad);
        }
      });
    }
  </script>
  <script>
    // Hero scatter fires after page settles — delay lets title read before images fly
    setTimeout(() => {
      const container = document.querySelector('.js-hero-scatter');
      if (container) container.classList.remove('is-stacked');
    }, 600);



    // Back button — View Transitions handles the fade automatically
    // (no manual veil needed)
  </script>

  <!-- DEV ONLY: Vignette tuner — only loads on localhost -->
  <script>
  if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
    const vals = { cx: 50, cy: 50, rx: 58, ry: 59, inner: 36, feather: 32 };

    const panel = document.createElement('div');
    panel.id = 'vignette-tuner';
    panel.style.cssText = `
      position: fixed; bottom: 20px; right: 20px; z-index: 9999;
      background: rgba(0,0,0,0.85); color: #fff;
      font-family: monospace; font-size: 12px;
      padding: 14px 16px; border-radius: 8px;
      width: 260px; box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    `;

    function applyVignette() {
      let el = document.getElementById('vignette-dev-style');
      if (!el) { el = document.createElement('style'); el.id = 'vignette-dev-style'; document.head.appendChild(el); }
      el.textContent = `.project-hero-imgwrap::after {
  background: radial-gradient(ellipse ${vals.rx}% ${vals.ry}% at ${vals.cx}% ${vals.cy}%, transparent ${vals.inner}%, #fff ${vals.inner + vals.feather}%);
}`;
    }

    function makeSlider(label, key, min, max) {
      const row = document.createElement('div');
      row.style.cssText = 'display:flex; align-items:center; gap:8px; margin:6px 0;';
      const lbl = document.createElement('span');
      lbl.style.cssText = 'width:76px; opacity:0.6; flex-shrink:0;';
      lbl.textContent = label;
      const input = document.createElement('input');
      input.type = 'range'; input.min = min; input.max = max; input.value = vals[key];
      input.style.cssText = 'flex:1; accent-color:#f90;';
      const num = document.createElement('span');
      num.style.cssText = 'width:30px; text-align:right;';
      num.textContent = vals[key];
      input.addEventListener('input', () => {
        vals[key] = +input.value;
        num.textContent = vals[key];
        applyVignette();
      });
      row.append(lbl, input, num);
      return row;
    }

    const title = document.createElement('div');
    title.style.cssText = 'font-weight:bold; margin-bottom:10px; opacity:0.9;';
    title.textContent = '⚙ Vignette Tuner';

    const copyBtn = document.createElement('button');
    copyBtn.style.cssText = `margin-top:10px; width:100%; padding:6px; background:#f90;
      color:#000; border:none; border-radius:4px; font-family:monospace;
      font-size:11px; cursor:pointer; font-weight:bold;`;
    copyBtn.textContent = 'Copy CSS';
    copyBtn.addEventListener('click', () => {
      const v = vals;
      const css = `radial-gradient(ellipse ${v.rx}% ${v.ry}% at ${v.cx}% ${v.cy}%, transparent ${v.inner}%, #fff ${v.inner + v.feather}%)`;
      navigator.clipboard.writeText(css);
      copyBtn.textContent = 'Copied!';
      setTimeout(() => copyBtn.textContent = 'Copy CSS', 1500);
    });

    panel.append(
      title,
      makeSlider('center X', 'cx', 0, 100),
      makeSlider('center Y', 'cy', 0, 100),
      makeSlider('width %', 'rx', 10, 200),
      makeSlider('height %', 'ry', 10, 200),
      makeSlider('inner edge', 'inner', 0, 100),
      makeSlider('feather', 'feather', 0, 100),
      copyBtn
    );

    document.body.appendChild(panel);
    applyVignette();
  }
  </script>
</body>
</html>
